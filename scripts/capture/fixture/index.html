<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture fixture</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #101014;
        color: #f4f4f5;
      }
      section {
        height: 100vh;
        display: grid;
        place-items: center;
        border-bottom: 1px solid #333;
        font-size: 4vw;
      }
      section:nth-child(odd) {
        background: #1c1c24;
      }
      #spinner {
        position: fixed;
        top: 40px;
        left: 40px;
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #f97316, #8b5cf6);
        z-index: 2;
      }
      #counter {
        position: fixed;
        right: 40px;
        top: 40px;
        font: 700 48px/1 ui-monospace, monospace;
        z-index: 2;
      }
      .card {
        width: 30vw;
        height: 20vh;
        background: #22c55e;
        border-radius: 16px;
        transition: transform 0.3s;
      }
      .card:hover {
        transform: scale(1.15) rotate(-3deg);
      }
      #cookie-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 24px;
        background: #fde047;
        color: #111;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="spinner"></div>
    <div id="counter">0</div>
    <div id="cookie-banner">Fixture cookie banner - should be hidden in captures</div>
    <section>Section 1</section>
    <section><div class="card" id="hover-card"></div></section>
    <section>Section 3</section>
    <section id="middle">Section 4</section>
    <section>Section 5</section>
    <section>Section 6</section>

    <script src="../../../node_modules/gsap/dist/gsap.min.js"></script>
    <script>
      // Continuous motion so every captured frame differs - the duplicate check reads this
      gsap.to("#spinner", { rotation: 360, x: 600, duration: 2, repeat: -1, yoyo: true, ease: "none" });
      const counter = document.getElementById("counter");
      let frame = 0;
      gsap.ticker.add(() => {
        counter.textContent = String(++frame);
      });
    </script>
  </body>
</html>
