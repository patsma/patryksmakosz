<script>

    TweenLite.set('html', {autoAlpha: 1});


    var select = function (s) {
            return document.querySelector(s);
        },
        selectAll = function (s) {
            return document.querySelectorAll(s);
        }
    ;


    highlights = selectAll('#highlights > path');
    background = select('#background');
    constans_cta = select('#constans_cta');
    constans_snoqualmie_casino_logo = select('#constans_snoqualmie_casino_logo');
    lunar_new_year_logo_s01 = select('#lunar_new_year_logo_s01');
    scene02_over = selectAll('#scene02_over');
    scene02_milion = selectAll('#scene02_milion');
    scene02_in_cash_prizes = selectAll('#scene02_in_cash_prizes');
    win_one_of_three = selectAll('#win_one_of_three');
    new_fords = selectAll('#new_fords');
    car = selectAll('#car');
    a_trip_for_two_to = selectAll('#a_trip_for_two_to');
    and = selectAll('#and');
    hong_kong = selectAll('#hong_kong');
    beijing = selectAll('#beijing');
    lunar_new_year_logo_top = selectAll('#lunar_new_year_logo_top');
    scene05_over = selectAll('#scene05_over');
    scene05_milion = selectAll('#scene05_milion');
    scene05_in_cars_cash_and_more = selectAll('#scene05_in_cars_cash_and_more');


    TweenMax.staggerFromTo(highlights, 10, {
        autoAlpha: 0.1,
        repeat: -1,
        yoyo: true,
        cycle: {yPercent: [50, 100, 150, 200, 250], xPercent: [10, 20, 30, 40, 50]}
    }, {
        autoAlpha: 0.4,
        cycle: {yPercent: [-50, -100, -150, -200, -250], xPercent: [-50, -100, -150, -200, -250]}
    }, 0.01);

    function tl01() {
        var tl = new TimelineMax({repeat: 1, repeatDelay: 1.5});

        tl

            .to(lunar_new_year_logo_s01, .5, {autoAlpha: 1})

            .to('body', 1, {autoAlpha: 1})

            .add('hide_lunar_show_over')
            .to(lunar_new_year_logo_s01, .25, {scaleY: 0}, 'hide_lunar_show_over')
            .to([constans_cta, constans_snoqualmie_casino_logo], .25, {autoAlpha: 0}, 'hide_lunar_show_over')
            .from(scene02_over, .25, {scaleY: 0, transformOrigin: 'center center'}, 'hide_lunar_show_over')
            .from(scene02_milion, .25, {scaleY: 0, transformOrigin: 'center center'}, 'hide_lunar_show_over')
            .from(scene02_in_cash_prizes, .25, {scaleY: 0, transformOrigin: 'center center'}, 'hide_lunar_show_over')

            .to('body', 1, {autoAlpha: 1})

            .add('hide_over_show_car')
            .to([scene02_over, scene02_milion, scene02_in_cash_prizes], .5, {autoAlpha: 0}, 'hide_over_show_car')
            .staggerFrom([win_one_of_three, new_fords, car], 1, {autoAlpha: 0, xPercent: 50}, 0.1, 'hide_over_show_car')

            .to('body', 1, {autoAlpha: 1})

            .add('hide_car_show_trip')
            .staggerTo([win_one_of_three, new_fords, car], 1, {autoAlpha: 0, xPercent: -50}, 0.1, 'hide_car_show_trip')
            .staggerFrom([a_trip_for_two_to, hong_kong, and, beijing], 1, {
                autoAlpha: 0,
                xPercent: 50,
                ease: Back.easeIn
            }, 0.2, 'hide_car_show_trip-=0.2')


            .to('body', 1, {autoAlpha: 1})


            .add('hide_trip_show_last')
            .staggerTo([a_trip_for_two_to, hong_kong, and, beijing], 1, {
                autoAlpha: 0,
                yPercent: -50,
                ease: Back.easeIn
            }, 0.2, 'hide_trip_show_last')
            .staggerFrom([lunar_new_year_logo_top, scene05_over, scene05_milion, scene05_in_cars_cash_and_more], 1, {
                autoAlpha: 0,
                yPercent: -50,
                ease: Back.easeIn
            }, 0.2, 'hide_trip_show_last+=0.2')
            .to([constans_cta, constans_snoqualmie_casino_logo], .25, {autoAlpha: 1})
        ;


        return tl;
    }

    tl01();


</script>
